name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: windows/package-lock.json
    
    - name: Install dependencies
      working-directory: windows
      run: npm ci
    
    - name: Build Windows x64 installer
      working-directory: windows
      run: npm run build:win-x64
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build Windows ARM64 installer
      working-directory: windows
      run: npm run build:win-arm64
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: List built files
      working-directory: windows
      run: dir dist
    
    - name: Upload installers as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PromptForge-Windows-Installers
        path: windows/dist/*.exe
        if-no-files-found: error
        retention-days: 90
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: windows/dist/*.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
